[tox]
requires = tox-uv
env_list =
    py{310,311,312,313}-dj52-wt70
    py{310,311,312,313,314}-dj52-wt80
    py{312,313,314}-dj60-wt80
    py{312,313,314}-dj61-wt80
    py{312,313,314}-dj61-nowagtail

[testenv]
dependency_groups = dev
deps =
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
    wt70: wagtail>=7.0,<7.1
    wt80: wagtail>=8.0,<8.1
commands = pytest {posargs}
