[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "django-docshelf"
description = "Document library for Django and Wagtail: categorised entries, files or links, versions behind stable URLs."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Altiparmak" }]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "Django>=5.2",
    "django-treebeard>=4.8",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 7",
    "Framework :: Wagtail :: 8",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
wagtail = ["wagtail>=7.0"]

[project.urls]
Source = "https://github.com/altipard/django-docshelf"
Issues = "https://github.com/altipard/django-docshelf/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff",
    "commitizen",
    "pre-commit",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/docshelf"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py310"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["docshelf"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
tag_format = "$version"
major_version_zero = true
